<!DOCTYPE html>
<html lang="en">
<head>
  <title>login findback</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>

<body>
<div class="fb-login py-5">
  <div class="container">
  <div class="row justify-content-center">
  <div class="col-11 col-sm-8 col-md-6 col-lg-4">

        <form class="text-center">

          <div class="mb-3">
            <label for="access-number" class="form-label fb-label">ACCESS NUMBER</label>
            <input type="text" id="access-number" class="form-control fb-input">
          </div>

          <div class="mb-3">
            <label for="inputPassword6" class="form-label fb-label">Password</label>
            <input type="password" id="inputPassword6" class="form-control fb-input"
                   aria-describedby="passwordHelpInline">
            <div id="passwordHelpInline" class="form-text">
              Must be 8-20 characters long.
            </div>
          </div>

          <button class="btn btn-primary fb-button" onclick="window.location.href='index.html'">Login</button>

     </form>

   </div>
   </div>
   </div>
</div>

<footer class="fb-footer">
    <div class="container text-center text-md-start">
    <div class="row align-items-center">
      <div class="col-md-6 mb-3 mb-md-0">
        <h5 class="fw-bold mb-1">Findback</h5>
        <p class="small mb-0">Reconnecting students with their lost belongings on campus.</p>
      </div>
      <div class="col-md-6 text-md-end">
        <p class="small mb-0">&copy; 2026 Findback Student Project. Built for demonstration.</p>
      </div>
    </div>
  </div>
  </footer>


</body> 
</html>
