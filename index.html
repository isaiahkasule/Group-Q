<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Findback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Section 2: NAVBAR (Paul)-->


    <!-- Section 3: HERO (Jannifer)-->


    <!-- Section 4: FILTER BUTTONS + CARDS (Jessy)-->
  <!-- Filter buttons -->
  <div class="btn-group mb-4" id="statusFilter" role="group" aria-label="Filter by status">
    <button type="button" class="btn btn-outline-dark active" data-status="">All</button>
    <button type="button" class="btn btn-outline-dark" data-status="lost">Lost</button>
    <button type="button" class="btn btn-outline-dark" data-status="found">Found</button>
  </div>

  <!-- Cards -->
  <div class="row g-4">

    <div class="col-12 col-md-6 col-lg-4">
      <div class="fb-card" data-status="lost">
        <span class="fb-status lost">Lost</span>
        <img src="umbrella.jpg" alt="Black umbrella">
        <h2 class="fb-title">Black Umbrella</h2>
        <p class="fb-meta">Lecture Hall B · 27 Oct 2026</p>
        <p class="fb-contact">07XX XXX XXX</p>
      </div>
    </div>

    <div class="col-12 col-md-6 col-lg-4">
      <div class="fb-card" data-status="found">
        <span class="fb-status found">Found</span>
        <img src="key.jpg" alt="Set of keys">
        <h2 class="fb-title">Set of Keys</h2>
        <p class="fb-meta">Library · 26 Oct 2026</p>
        <p class="fb-contact">07XX XXX XXX</p>
      </div>
    </div>

  </div>

  <div class="modal fade" id="reportModal" tabindex="-1" aria-labelledby="reportModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h2 class="modal-title h5" id="reportModalLabel">Report a Lost or Found Item</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
    <!-- Section 6: REPORT FORM POPUP (Sidenya)-->

    <!-- Section 7: FOOTER (Paul)-->


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
